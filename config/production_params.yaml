capital: 5000
whole_shares: true

strategies:
  rsi2:
    enabled: true
    max_positions: 1
    params:
      rsi_period: 2
      rsi_entry_threshold: 10.0
      sma_trend_period: 200
      sma_exit_period: 5
      sma_trend_buffer: 1.01
      position_fraction: 1.0
    universe:  # production allowlist; validated afresh before an actionable signal
      - META
      - GOOGL
      - MSFT
      - NVDA
      - V
      - MA
      - AVGO
      - AAPL
      - ADBE
    watchlist:
      - UNH
      - GE
      - AMZN
    fee_model: us_stocks_usd_account

  ibs:
    enabled: true
    max_positions: 1
    params:
      ibs_entry_threshold: 0.2
      ibs_exit_threshold: 0.8
      sma_trend_period: 200
      position_fraction: 1.0
    universe:  # production allowlist; ranking is recomputed from past trades
      - NVDA
      - META
      - MSFT
      - AAPL
      - AMZN
      - GOOGL
      - V
      - AVGO
      - MA
      - ADBE
      - CSCO
    watchlist:
      - PYPL
      - AMD
    fee_model: us_stocks_usd_account

  tom:
    enabled: true
    max_positions: 1
    params:
      entry_days_before_eom: 5
      exit_day_of_new_month: 3
      position_fraction: 1.0
    universe:
      - META
      - NFLX
      - COST
      - TSLA
      - ORCL
      - LLY
      - AVGO
      - V
      - AAPL
      - WMT
      - MA
      - HD
      - ADBE
      - NVDA
      - AMZN
      - UNH
      - MSFT
    watchlist: []
    fee_model: us_stocks_usd_account

notes:
  - "Les trois listes sont des listes autorisees, pas des validations actuelles."
  - "Une position Signal Radar et un portefeuille papier de 5000 USD au total."
  - "Le classement vient du rendement mensuel prudent net de couts, pas de l'ordre YAML."
  - "Le scanner bloque les achats sans confirmation du compte, couts verifies et validation actuelle."
  - "Le montant et le nombre d'actions affiches sont indicatifs avant l'ouverture."
